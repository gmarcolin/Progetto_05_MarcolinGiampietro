version: '3.8'

services:
  # Servizio 1: Microservizio REST FastAPI per le predizioni
  sentiment-api:
    image: ghcr.io/${GITHUB_USER}/sentiment-analysis/sentiment-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment-api-service
    ports:
      - "8000:8000"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Servizio 2: Dashboard di Monitoraggio e Telemetria (Gradio)
  sentiment-dashboard:
    image: ghcr.io/${GITHUB_USER}/sentiment-analysis/sentiment-api:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentiment-dashboard-ui
    ports:
      - "7860:7860"
    environment:
      - HF_TOKEN=${HF_TOKEN:-}
    # Sovrascrive il CMD del Dockerfile per avviare la dashboard anziché l'API
    command: ["python", "-m", "src.app"]
    restart: unless-stopped
