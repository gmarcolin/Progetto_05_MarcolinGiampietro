name: Production Monitoring
on:
  schedule:
    - cron: '0 0 * * 1'
  workflow_dispatch:
jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Run Simulation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install -r requirements.txt
          python src/monitor_simulation.py