name: Production Monitoring
on:
  schedule:
    - cron: '0 0 * * 1' # Gira ogni lunedì a mezzanotte
  workflow_dispatch: # Permette l'avvio manuale per test

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5 # v5 è ottimizzata per Python 3.12
        with:
          python-version: '3.12'
          cache: 'pip' # Velocizza i workflow successivi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Monitoring & Trigger Decay
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # Token automatico di GitHub
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python src/monitor_simulation.py
