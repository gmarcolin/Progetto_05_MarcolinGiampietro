name: Model Retraining
on:
  repository_dispatch:
    types: [model_decay]

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Train and Compare
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ID: ${{ vars.HF_HUB_ID }}
        run: |
          pip install -r requirements.txt
          python -c "
          from src.data_logic import load_and_validate_data
          from src.train import train_model
          from src.evaluate import champion_challenger_check
          import os

          # 1. Caricamento dati completi
          train_df, test_df = load_and_validate_data()

          # 2. Training Challenger
          print('Training Challenger model...')
          trainer, model, tokenizer = train_model(train_df, test_df)
          model.save_pretrained('./challenger')
          tokenizer.save_pretrained('./challenger')

          # 3. Confronto con Champion
          is_better, f1 = champion_challenger_check('./challenger', test_df)
          
          if is_better:
              print(f'SUCCESS: Challenger (F1: {f1}) beats Champion. Uploading...')
              model.push_to_hub(os.environ['HF_TOKEN'], repo_id=os.environ['HF_HUB_ID'])
              tokenizer.push_to_hub(os.environ['HF_TOKEN'], repo_id=os.environ['HF_HUB_ID'])
          else:
              print(f'REJECTED: Challenger (F1: {f1}) is not better than Champion.')
          "