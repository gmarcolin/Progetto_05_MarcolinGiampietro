name: Model Retraining
on:
  repository_dispatch:
    types: [model_decay]
  workflow_dispatch:

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Retrain, Compare and Log Post-Retrain Metric
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ID: ${{ vars.HF_HUB_ID }}
        run: |
          python -c "
          from src.data_logic import load_and_validate_data
          from src.train import train_model
          from src.evaluate import champion_challenger_check
          from src.metrics_logger import log_metric
          import os

          # 1. Caricamento dati completi
          train_df, test_df = load_and_validate_data()

          # 2. Training Challenger
          print('Training Challenger model...')
          trainer, model, tokenizer = train_model(train_df, test_df)
          model.save_pretrained('./challenger')
          tokenizer.save_pretrained('./challenger')

          # 3. Confronto con Champion
          is_better, challenger_f1 = champion_challenger_check('./challenger', test_df)

          # Registriamo il risultato post-retraining nel log metriche
          log_metric(
              batch_id='post_retrain_eval',
              model_id=os.environ.get('HF_HUB_ID', 'challenger_model'),
              f1_score=challenger_f1,
              is_drifted=False,
              event_type='post_retrain'
          )

          if is_better and 'HF_TOKEN' in os.environ and 'HF_HUB_ID' in os.environ:
              print('Challenger approvato. Push su Hugging Face Hub...')
              model.push_to_hub(repo_id=os.environ['HF_HUB_ID'], token=os.environ['HF_TOKEN'])
              tokenizer.push_to_hub(repo_id=os.environ['HF_HUB_ID'], token=os.environ['HF_TOKEN'])
          "
