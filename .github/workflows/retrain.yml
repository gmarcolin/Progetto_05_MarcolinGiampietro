name: Model Retraining & Continuous Delivery

on:
  repository_dispatch:
    types: [model_decay]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Run ID manuale'
        default: 'manual_run'

jobs:
  train_and_evaluate:
    name: Retrain Challenger & Golden Benchmark Evaluation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dev Dependencies
        run: pip install -r requirements-dev.txt

      - name: Run Retraining Module
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ID: ${{ vars.HF_HUB_ID }}
          RUN_ID: ${{ github.event.client_payload.run_id || github.event.inputs.run_id || 'run_manual' }}
        run: python -m src.retrain

      - name: Upload Challenger Weights Artifact
        uses: actions/upload-artifact@v4
        with:
          name: challenger-weights
          path: ./challenger
          retention-days: 1

      - name: Upload Evaluation Results Artifact
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval_results.json
          retention-days: 1
