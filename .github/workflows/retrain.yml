name: Model Retraining & Continuous Delivery
on:
  repository_dispatch:
    types: [model_decay]
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Identificativo univoco della Run'
        default: 'manual_trigger'

jobs:
  train_and_evaluate:
    name: 1. Retrain & Gatekeeper Evaluation
    runs-on: ubuntu-latest
    outputs:
      deploy_approved: ${{ steps.retrain_step.outputs.deploy_approved }}
      challenger_f1: ${{ steps.retrain_step.outputs.challenger_f1 }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute Retraining Script
        id: retrain_step
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ID: ${{ vars.HF_HUB_ID }}
          RUN_ID: ${{ github.event.client_payload.run_id || github.event.inputs.run_id || 'run_manual' }}
        run: python -m src.retrain

      - name: Save Challenger Model Artifact
        if: steps.retrain_step.outputs.deploy_approved == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: challenger-weights
          path: ./challenger
          retention-days: 1

  deploy_champion:
    name: 2. Deploy Champion to Model Hub
    needs: train_and_evaluate
    if: needs.train_and_evaluate.outputs.deploy_approved == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Hugging Face Hub CLI
        run: pip install huggingface_hub

      - name: Download Challenger Artifact
        uses: actions/download-artifact@v4
        with:
          name: challenger-weights
          path: ./challenger

      - name: Push New Champion Model to HF Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_HUB_ID: ${{ vars.HF_HUB_ID }}
          RUN_ID: ${{ github.event.client_payload.run_id || github.event.inputs.run_id || 'run_manual' }}
          F1_SCORE: ${{ needs.train_and_evaluate.outputs.challenger_f1 }}
        run: |
          python -c "
          import os
          from huggingface_hub import HfApi
          api = HfApi()
          commit_msg = f'deploy: promote challenger to champion | run: {os.environ[\"RUN_ID\"]} | Golden F1: {os.environ[\"F1_SCORE\"]}'
          api.upload_folder(
              folder_path='./challenger',
              repo_id=os.environ['HF_HUB_ID'],
              repo_type='model',
              token=os.environ['HF_TOKEN'],
              commit_message=commit_msg
          )
          print('Nuovo Champion rilasciato con successo su Hugging Face Model Hub!')
          "
