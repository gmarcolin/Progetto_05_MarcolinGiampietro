name: Deploy App

on:
  workflow_run:
    workflows: ["Model Retraining"]
    types: [completed]
  push:
    branches: [main]
    paths: ['src/app.py', 'config.yaml']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # Invece di lottare con lo Space, aggiorniamo il file README del Modello
      # per attivare le Inference API sul Model Hub.
      - name: Ensure Inference API is active
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          pip install huggingface_hub
          python -c "from huggingface_hub import metadata_update; metadata_update('${{ vars.HF_HUB_ID }}', {'inference': True}, token='${{ env.HF_TOKEN }}')"

      # Opzionale: Se hai creato uno Space (anche se limitato), carichiamo l'app leggera
