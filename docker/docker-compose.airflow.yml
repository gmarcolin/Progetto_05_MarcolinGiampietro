networks:
  mlops-network:
    external: true

services:
  airflow-postgres:
    image: postgres:15-alpine
    container_name: airflow-postgres
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    networks:
      - mlops-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow"]
      interval: 5s
      timeout: 5s
      retries: 5

  airflow-webserver:
    image: apache/airflow:2.9.3-python3.12
    container_name: airflow-webserver
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      # Installazione pulita e nativa delle sole librerie necessarie ai task
      - _PIP_ADDITIONAL_REQUIREMENTS=requests pandas evaluate huggingface_hub pyyaml
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - SENTIMENT_API_URL=http://sentiment-api:8000
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/scripts:/opt/airflow/scripts
      - ../src:/opt/airflow/src
      - ../config.yaml:/opt/airflow/config.yaml
    ports:
      - "8085:8080"
    networks:
      - mlops-network
    command: >
      bash -c "airflow db migrate &&
               (airflow users create --username admin --password admin --firstname Admin --lastname Admin --role Admin --email admin@example.com || true) &&
               airflow webserver"

  airflow-scheduler:
    image: apache/airflow:2.9.3-python3.12
    container_name: airflow-scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_started
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - _PIP_ADDITIONAL_REQUIREMENTS=requests pandas evaluate huggingface_hub pyyaml
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPOSITORY=${GITHUB_REPOSITORY:-}
      - HF_TOKEN=${HF_TOKEN:-}
      - SENTIMENT_API_URL=http://sentiment-api:8000
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/scripts:/opt/airflow/scripts
      - ../src:/opt/airflow/src
      - ../config.yaml:/opt/airflow/config.yaml
    networks:
      - mlops-network
    command: bash -c "airflow scheduler"
